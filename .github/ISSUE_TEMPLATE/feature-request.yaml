name: Feature Request
description: Suggest a feature or improvement for the Create Tauri App Nuxt
title: 'feat: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem you want to solve and how the feature would help.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight Checklist
      options:
        - label: I have searched the existing issues and this feature has not been requested yet.
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected Area
      description: Which part of the project would this feature touch?
      options:
        - Nuxt frontend (app)
        - Tauri backend (src-tauri)
        - Build / CI / Tooling
        - Setup / Documentation
        - Other / not sure
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? What is the use case?
      placeholder: 'As a user, I want to ... so that ...'
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe how you would like this to work.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Other approaches or workarounds you have considered.

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Mockups, references to similar features in other tools, or anything else that helps.

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to submit a pull request for this feature.
          required: false
