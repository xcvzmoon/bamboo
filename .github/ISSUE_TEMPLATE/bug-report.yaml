name: Bug Report
description: Report a defect or unexpected behavior in the Create Tauri App Nuxt
title: 'bug: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Tell us what happened and how to reproduce it.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight Checklist
      options:
        - label: I have searched the existing issues and this bug has not been reported yet.
          required: true
        - label: I am running the latest version of create-tauri-app-nuxt.
          required: false

  - type: dropdown
    id: area
    attributes:
      label: Affected Area
      description: Which part of the project is affected?
      options:
        - Nuxt frontend (app)
        - Tauri backend (src-tauri)
        - Build / CI / Tooling
        - Setup / Documentation
        - Other / not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version / Commit
      description: The commit SHA or version you are running.
      placeholder: 'e.g. 74ab7d0'
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node Version
      description: Output of `node --version`.
      placeholder: 'v24.0.0'
    validations:
      required: true

  - type: input
    id: rust-version
    attributes:
      label: Rust Version
      description: Output of `rustc --version`.
      placeholder: 'rustc 1.90.0'
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OS Version
      placeholder: 'e.g. macOS 15.5, Windows 11 24H2, Ubuntu 24.04'
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Describe the problem.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: List the steps that reproduce the problem.
      placeholder: |
        1. Open the app
        2. Go to '...'
        3. Click on '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened instead?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Screenshots
      description: Paste relevant logs or attach screenshots. Logs are formatted as code automatically.
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Anything else that might help us understand the problem.

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to submit a pull request for this bug.
          required: false
