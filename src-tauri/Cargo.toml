[package]
name = "create-tauri-app-nuxt"
description = "Create application using Tauri with Nuxt"
version = "0.0.0"
authors = ["Mon Albert Gamil <mrgamilmonalbert@gmail.com>"]
license = "MIT"
repository = "https://github.com/xcvzmoon/create-tauri-app-nuxt"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.0", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-log = "2"
