[package]
name = "bamboo"
description = "Desktop app for running headless browser jobs"
version = "0.0.0"
authors = ["Mon Albert Gamil <mrgamilmonalbert@gmail.com>"]
license = "MIT"
repository = "https://github.com/xcvzmoon/bamboo"
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.0", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-log = "2"
rusqlite = { version = "0.41.0", features = ["bundled", "serde_json"] }
sha2 = "0.11.1"
uuid = { version = "1.29.0", features = ["v7", "serde"] }
thiserror = "2.0.21"
tempfile = "3.27.0"
hex = "0.4.3"

[[test]]
name = "storage"
path = "../tests/rust/storage.rs"
